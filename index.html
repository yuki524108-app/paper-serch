<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>論文検索</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+JP:wght@400;600&family=Source+Serif+4:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f7f7;--ink:#14262b;--sub:#5b6e73;--line:#d5dfe0;--ok:#0e7c86;--part:#b7791f;--warn:#b3261e}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.7 "IBM Plex Sans JP",sans-serif}
main{max-width:820px;margin:0 auto;padding:40px 20px 80px}
h1{font:600 28px/1.3 "Source Serif 4","IBM Plex Sans JP",serif;margin:0 0 4px}
.lead{color:var(--sub);margin:0 0 24px}
form{display:flex;gap:8px}
input[type=text],input[type=password]{flex:1;width:100%;padding:12px 14px;font:inherit;border:1px solid var(--line);border-radius:6px;background:#fff}
button{padding:12px 20px;font:inherit;font-weight:600;border:0;border-radius:6px;background:var(--ink);color:#fff;cursor:pointer}
button:disabled{opacity:.5}
:focus-visible{outline:3px solid var(--ok);outline-offset:2px}
.meta{color:var(--sub);font-size:14px;margin:16px 0}
.sum{background:#fff;border:1px solid var(--line);border-radius:6px;padding:16px 18px;margin:20px 0;white-space:pre-wrap}
.sum b{display:block;margin-bottom:6px}
.note{color:var(--warn);font-size:14px}
article{background:#fff;border:1px solid var(--line);border-left:6px solid var(--part);border-radius:6px;padding:14px 18px;margin:12px 0}
article.verified{border-left-color:var(--ok)}article.warn{border-left-color:var(--warn)}article.no{opacity:.6}
h2{font:600 18px/1.5 "Source Serif 4","IBM Plex Sans JP",serif;margin:0 0 4px}
.by{color:var(--sub);font-size:14px}
.badge{font-size:13px;font-weight:600}
.verified .badge{color:var(--ok)}.partial .badge{color:var(--part)}.warn .badge{color:var(--warn)}
.rel{margin:8px 0;font-size:15px}.rel.yes b{color:var(--ok)}.rel.partial b{color:var(--part)}.rel.no b{color:var(--sub)}
blockquote{margin:6px 0 0;padding-left:12px;border-left:2px solid var(--line);color:var(--sub);font-size:14px}
details{margin-top:8px;font-size:15px}summary{cursor:pointer;color:var(--sub)}
.opt{display:block;margin-top:8px;color:var(--sub);font-size:14px}
.set{margin-top:16px;font-size:14px}.set label{display:block;margin:10px 0 2px;color:var(--sub)}
a{color:var(--ok)}
select{width:100%;padding:12px 14px;font:inherit;border:1px solid var(--line);border-radius:6px;background:#fff}
@media(max-width:500px){form{flex-direction:column}}
</style></head><body><main>
<h1>論文検索</h1>
<p class="lead">PubMed と OpenAlex から取得し、DOI を Crossref で照合します。オープンアクセスの本文が取れる論文は本文で、取れない論文はアブストラクトで、質問との一致を判定します。</p>
<form id="f"><input type="text" id="q" placeholder="例: SGLT2阻害薬と心不全の入院リスク" aria-label="検索" required minlength="2"><button id="go">検索</button></form>
<label class="opt"><input type="checkbox" id="deep" checked> 本文で質問との一致を確認する(時間がかかります)</label>
<details class="set"><summary>設定(APIキー・メール)</summary>
<label for="prov">使う AI(日本語の質問の変換・一致判定・要約に使います)</label>
<select id="prov"><option value="gemini">Gemini(Google の APIキー)</option><option value="claude">Claude(Anthropic の APIキー)</option></select>
<label for="key" id="keylabel">APIキー(空欄なら検索のみ)</label>
<input type="password" id="key" autocomplete="off">
<div id="gbox"><label for="gmodel">Gemini のモデル名(通常は変えなくて大丈夫です)</label>
<input type="text" id="gmodel" placeholder="gemini-3.1-flash-lite"></div>
<label for="mail">メールアドレス(PubMed などへの連絡先。任意)</label>
<input type="text" id="mail" placeholder="you@example.com">
<p class="meta">入力した内容は、このブラウザの中だけに保存されます。GitHub やほかの人には送られません。共用のパソコンでは入力しないでください。</p></details>
<div id="out" aria-live="polite"></div>
</main>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const store={get:k=>{try{return localStorage.getItem(k)||""}catch{return""}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch{}}};
const prov=()=>$("#prov").value;
const GEM_DEFAULT="gemini-3.1-flash-lite";
function loadProv(){
  $("#key").value=store.get("ps_key_"+prov());
  $("#key").placeholder=prov()==="gemini"?"AIza...":"sk-ant-...";
  $("#gbox").style.display=prov()==="gemini"?"":"none"}
$("#prov").value=store.get("ps_prov")||"gemini";loadProv();
$("#prov").onchange=()=>{store.set("ps_prov",prov());loadProv()};
$("#gmodel").value=store.get("ps_gmodel");$("#gmodel").oninput=e=>store.set("ps_gmodel",e.target.value.trim());
$("#mail").value=store.get("ps_mail");
$("#key").oninput=e=>store.set("ps_key_"+prov(),e.target.value.trim());
$("#mail").oninput=e=>store.set("ps_mail",e.target.value.trim());
const KEY=()=>$("#key").value.trim(), MAIL=()=>$("#mail").value.trim()||"you@example.com";
const MODEL="claude-sonnet-5-5";
const NCBI="https://eutils.ncbi.nlm.nih.gov/entrez/eutils", EPMC="https://www.ebi.ac.uk/europepmc/webservices/rest";
const ORDER={yes:0,partial:1,unknown:2,no:3};
const MATCH={yes:"質問に一致",partial:"一部一致",no:"不一致",unknown:"判定不能"};
const LABEL={verified:"確認済み",partial:"一部未確認",warn:"要確認"};
const DOI={ok:"DOI一致",none:"DOIなし",notfound:"DOIが見つかりません",mismatch:"DOIとタイトルが不一致",error:"DOI照合できず"};

const get=(u,p={})=>fetch(u+"?"+new URLSearchParams(p),{signal:AbortSignal.timeout(30000)});
async function getJson(u,p){const r=await get(u,p);if(!r.ok)throw new Error(new URL(u).host+" がエラーを返しました (HTTP "+r.status+")");return r.json()}
const pLimit=n=>{let a=0;const q=[];const next=()=>{if(a>=n||!q.length)return;a++;const{fn,res,rej}=q.shift();fn().then(res,rej).finally(()=>{a--;next()})};return fn=>new Promise((res,rej)=>{q.push({fn,res,rej});next()})};
const normDoi=d=>(d||"").replace(/^https?:\/\/(dx\.)?doi\.org\//i,"").toLowerCase().trim()||null;
const norm=s=>s.toLowerCase().replace(/\s+/g," ").trim();
const xml=t=>new DOMParser().parseFromString(t,"text/xml");
function similarity(a,b){const g=s=>{const t=s.toLowerCase().replace(/[^a-z0-9]/g,""),m=new Map();for(let i=0;i<t.length-1;i++){const k=t.slice(i,i+2);m.set(k,(m.get(k)||0)+1)}return m};
  const A=g(a),B=g(b);let h=0,na=0,nb=0;for(const[k,v]of A){na+=v;h+=Math.min(v,B.get(k)||0)}for(const v of B.values())nb+=v;return na+nb?2*h/(na+nb):0}

async function pubmed(q,n){
  const j=await getJson(NCBI+"/esearch.fcgi",{db:"pubmed",term:q,retmax:n,retmode:"json",sort:"relevance",email:MAIL()});
  const ids=j.esearchresult.idlist; if(!ids.length)return[];
  const r=await get(NCBI+"/efetch.fcgi",{db:"pubmed",id:ids.join(","),retmode:"xml",email:MAIL()});
  if(!r.ok)throw new Error("eutils.ncbi.nlm.nih.gov がエラーを返しました (HTTP "+r.status+")");
  return[...xml(await r.text()).querySelectorAll("PubmedArticle")].map(a=>{
    const t=s=>a.querySelector(s)?.textContent.trim()||"";
    return{pmid:t("MedlineCitation > PMID"),
      doi:normDoi([...a.querySelectorAll("PubmedData ArticleId")].find(x=>x.getAttribute("IdType")==="doi")?.textContent),
      title:t("ArticleTitle"),abstract:[...a.querySelectorAll("Abstract > AbstractText")].map(x=>x.textContent.trim()).join(" "),
      journal:t("Journal > Title"),year:t("JournalIssue PubDate Year")||t("JournalIssue PubDate MedlineDate").slice(0,4),
      authors:[...a.querySelectorAll("AuthorList > Author")].map(x=>((x.querySelector("LastName")?.textContent||"")+" "+(x.querySelector("Initials")?.textContent||"")).trim()).filter(Boolean).slice(0,6),
      sources:["PubMed"]}})}
async function openalex(q,n){
  const r=await getJson("https://api.openalex.org/works",{search:q,"per-page":n,filter:"has_abstract:true,type:article",mailto:MAIL()});
  return(r.results||[]).map(w=>{
    const words=Object.entries(w.abstract_inverted_index||{}).flatMap(([x,ps])=>ps.map(p=>[p,x])).sort((a,b)=>a[0]-b[0]);
    return{pmid:((w.ids||{}).pmid||"").split("/").pop()||null,doi:normDoi(w.doi),title:w.title||"",abstract:words.map(x=>x[1]).join(" "),
      journal:w.primary_location?.source?.display_name||"",year:String(w.publication_year||""),
      authors:(w.authorships||[]).slice(0,6).map(a=>a.author.display_name),sources:["OpenAlex"]}})}
function mergePapers(lists){
  const pool=new Map(),score=new Map();
  for(const l of lists)l.forEach((p,rank)=>{
    let key=[...pool.keys()].find(k=>{const v=pool.get(k);return(p.pmid&&v.pmid===p.pmid)||(p.doi&&v.doi===p.doi)});
    if(key!==undefined){const v=pool.get(key);v.sources=[...new Set([...v.sources,...p.sources])].sort();for(const f of["pmid","doi","abstract","journal"])v[f]=v[f]||p[f]}
    else{key=p.pmid||p.doi||p.title.toLowerCase();pool.set(key,p)}
    score.set(key,(score.get(key)||0)+1/(60+rank))});
  return[...pool.keys()].sort((a,b)=>score.get(b)-score.get(a)).map(k=>pool.get(k))}
async function checkDoi(p,limit){
  if(!p.doi){p.doi_check="none";return}
  await limit(async()=>{try{
    const r=await get("https://api.crossref.org/works/"+encodeURI(p.doi),{mailto:MAIL()});
    if(r.status===404){p.doi_check="notfound";return}
    const title=((await r.json()).message.title||[""])[0].replace(/<[^>]+>/g,"");
    p.doi_check=similarity(title,p.title)>0.8?"ok":"mismatch"}catch{p.doi_check="error"}})}
const status=p=>["mismatch","notfound"].includes(p.doi_check)?"warn":((p.pmid&&p.sources.includes("PubMed"))||p.doi_check==="ok"?"verified":"partial");

let llmErr=null;
async function claude(prompt,max){
  if(llmErr)throw new Error(llmErr);
  return prov()==="gemini"?callGemini(prompt,max):callClaude(prompt,max)}
async function callGemini(prompt,max){
  const model=$("#gmodel").value.trim()||GEM_DEFAULT;
  for(let i=0;;i++){
    const r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent?key=${encodeURIComponent(KEY())}`,
      {method:"POST",headers:{"content-type":"application/json"},
       body:JSON.stringify({contents:[{parts:[{text:prompt}]}],generationConfig:{maxOutputTokens:max+2000}}),signal:AbortSignal.timeout(60000)});
    const j=await r.json().catch(()=>({}));
    if(r.status===429&&i<2){await new Promise(x=>setTimeout(x,4000*(i+1)));continue}
    if(!r.ok){const m=j.error?.message||"Gemini API "+r.status;
      if([401,403,404].includes(r.status)||(r.status===400&&/api.?key/i.test(m)))llmErr=m; throw new Error(m)}
    const t=(j.candidates?.[0]?.content?.parts||[]).map(p=>p.text||"").join("");
    if(!t)throw new Error("Geminiから回答が得られませんでした("+(j.candidates?.[0]?.finishReason||j.promptFeedback?.blockReason||"理由不明")+")");
    return t}}
async function callClaude(prompt,max){
  const r=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",
    headers:{"x-api-key":KEY(),"anthropic-version":"2023-06-01","content-type":"application/json","anthropic-dangerous-direct-browser-access":"true"},
    body:JSON.stringify({model:MODEL,max_tokens:max,messages:[{role:"user",content:prompt}]}),signal:AbortSignal.timeout(60000)});
  const j=await r.json(); if(!r.ok){const m=j.error?.message||"Claude API "+r.status; if(r.status===401||r.status===403)llmErr=m; throw new Error(m)} return j.content[0].text}
const STOP=new Set(["and","or","of","the","in","for","with","to","on","by","a","an","vs"]);
async function makeConcepts(q){
  if(KEY()&&!llmErr){try{
    const d=JSON.parse((await claude('次の質問から、論文検索に必須の概念を最大4つ抽出し、各概念を英語の同義語(略称・表記ゆれを含む)最大4つで表してください。JSONのみ出力: {"concepts":[["synonym1","synonym2"],["..."]]}\n質問: '+q,400)).replace(/```(json)?/g,"").trim());
    const c=d.concepts.map(g=>g.map(String).filter(Boolean)).filter(g=>g.length);
    if(c.length)return c}catch{}}
  return(q.match(/[A-Za-z0-9][A-Za-z0-9\-\/.]*/g)||[]).filter(t=>t.length>=2&&!STOP.has(t.toLowerCase())).map(t=>[t])}
const buildPubmed=c=>c.map(g=>"("+g.map(t=>`"${t}"[tiab]`).join(" OR ")+")").join(" AND ");
function hasTerm(text,t){
  const low=text.toLowerCase(),k=t.toLowerCase().replace(/[^a-z0-9]/g,""); if(!k)return false;
  if(k.length<4)return new RegExp("(^|[^a-z0-9])"+t.toLowerCase().replace(/[.*+?^${}()|[\]\\\/-]/g,"\\$&")+"([^a-z0-9]|$)").test(low);
  return low.replace(/[^a-z0-9]/g,"").includes(k)}
async function fulltext(pmid){
  if(!pmid)return null;
  try{
    const s=await getJson(EPMC+"/search",{query:`EXT_ID:${pmid} AND SRC:MED`,format:"json",resultType:"lite"});
    const hit=(s.resultList.result||[])[0];
    if(!hit||!hit.pmcid||hit.isOpenAccess!=="Y")return null;
    const x=await get(`${EPMC}/${hit.pmcid}/fullTextXML`); if(!x.ok)return null;
    const paras=[...xml(await x.text()).querySelectorAll("body p")].map(p=>p.textContent.replace(/\s+/g," ").trim()).filter(t=>t.length>80);
    return paras.length?paras:null}catch{return null}}
function pick(paras,terms,limit=9000){
  const ts=terms.map(t=>t.toLowerCase());
  const cnt=t=>ts.reduce((n,w)=>n+t.toLowerCase().split(w).length-1,0);
  const order=paras.map((t,i)=>[i,cnt(t)]).sort((a,b)=>b[1]-a[1]||a[0]-b[0]);
  const chosen=[];let size=0;for(const[i]of order)if(size+paras[i].length<=limit){chosen.push(i);size+=paras[i].length}
  return chosen.sort((a,b)=>a-b).map(i=>paras[i]).join("\n")}
async function judge(q,terms,p,limit){
  await limit(async()=>{
    if(llmErr){p.match="unknown";p.reason="AIに接続できないため判定できません";return}
    const paras=await fulltext(p.pmid), text=paras?pick(paras,terms):p.abstract;
    p.basis=paras?"fulltext":"abstract";
    if(!text){p.match="unknown";p.reason="判定に使える本文・アブストラクトがありません";return}
    const prompt=`質問: ${q}\n論文: ${p.title}\n\n以下は論文の${paras?"本文抜粋":"アブストラクト"}です。この論文が質問に答える内容を含むか判定してください。JSONのみ出力:\n`+
      '{"match":"yes|partial|no","reason":"日本語1文","quote":"根拠になる原文(英語)の連続した引用、30語以内。なければ空文字"}\n'+
      "yesは、質問の対象集団・介入・アウトカムが提示された文章で確認できる場合のみ。書かれていないことは推測しない。\n\n"+text;
    try{
      const d=JSON.parse((await claude(prompt,400)).replace(/```(json)?/g,"").trim());
      p.match=["yes","partial","no"].includes(d.match)?d.match:"unknown";p.reason=d.reason||"";p.quote=d.quote||"";
      p.quote_ok=!!p.quote&&norm(text).includes(norm(p.quote));
      if(p.match==="yes"&&!p.quote_ok){p.match="partial";p.reason+="(根拠の引用が原文で確認できないため格下げ)"}
    }catch(e){p.match="unknown";p.reason="判定に失敗しました: "+e.message}})}
async function summarize(q,papers){
  if(!KEY()||!papers.length)return null;
  const ctx=papers.map(p=>`[${p.n}] ${p.title} (${p.year})\n${p.abstract.slice(0,1500)}`).join("\n\n");
  const text=await claude(`質問: ${q}\n\n以下の論文アブストラクトの記載だけを根拠に、日本語で簡潔に答えてください。各文末に根拠の番号を[1]のように付ける。アブストラクトに書かれていないことは書かず、分からない場合は「提示された論文からは判断できない」と述べる。\n\n`+ctx,900);
  const valid=new Set(papers.map(p=>p.n));
  return{text,invalid_refs:[...new Set([...text.matchAll(/\[(\d+)\]/g)].map(m=>+m[1]).filter(k=>!valid.has(k)))].sort((a,b)=>a-b)}}

async function search(q,deep,n=10){
  llmErr=null;
  const concepts=await makeConcepts(q);
  const pq=concepts.length?buildPubmed(concepts):q, oq=concepts.length?concepts.map(g=>g[0]).join(" "):q;
  const res=await Promise.allSettled([pubmed(pq,n*2),openalex(oq,n*2)]);
  const errors=res.map((r,i)=>r.status==="rejected"?["PubMed","OpenAlex"][i]+": "+(r.reason.message||r.reason):null).filter(Boolean);
  let papers=mergePapers(res.filter(r=>r.status==="fulfilled").map(r=>r.value));
  const total=papers.length;
  if(concepts.length)papers=papers.filter(p=>{const t=p.title+" "+p.abstract;return concepts.every(g=>g.some(w=>hasTerm(t,w)))});
  const excluded=total-papers.length; papers=papers.slice(0,n);
  const dl=pLimit(3); await Promise.all(papers.map(p=>checkDoi(p,dl)));
  if(deep&&KEY()){const ll=pLimit(prov()==="gemini"?2:4),terms=concepts.flat();await Promise.all(papers.map(p=>judge(q,terms,p,ll)))}
  papers.sort((a,b)=>(ORDER[a.match]??2)-(ORDER[b.match]??2));
  papers.forEach((p,i)=>{p.status=status(p);p.n=i+1});
  let summary=null;
  if(KEY()&&!llmErr){try{summary=await summarize(q,papers.filter(p=>p.abstract&&p.match!=="no"))}catch(e){errors.push("要約: "+e.message)}}
  return{query:pq,concepts,papers,summary,errors,excluded,llmErr}}

$("#f").onsubmit=async e=>{
  e.preventDefault(); $("#go").disabled=true;
  $("#out").innerHTML='<p class="meta">検索中です。本文の確認が入ると1分ほどかかります。</p>';
  try{
    const d=await search($("#q").value.trim(),$("#deep").checked);
    let h=`<p class="meta">検索式: <code>${esc(d.query)}</code> / ${d.papers.length}件${d.excluded?`(キーワードを含まない${d.excluded}件を除外)`:""}</p>`;
    if(d.llmErr)h+=`<p class="note">AIに接続できませんでした: ${esc(d.llmErr)}。APIキーとモデル名を確認してください。検索とキーワード絞り込みだけ行っています。</p>`;
    if(!d.concepts.length)h+='<p class="note">英数字のキーワードが見つからないため、絞り込みなしで検索しました。英語のキーワードで試すか、APIキーを設定してください。</p>';
    if(!KEY())h+='<p class="meta">APIキーが未設定のため、検索と DOI 照合のみ行いました。日本語の質問の変換、一致判定、要約には、「設定」でAPIキーを入れてください。</p>';
    d.errors.forEach(x=>h+=`<p class="note">取得に失敗した情報源があります: ${esc(x)}</p>`);
    if(d.summary){h+=`<div class="sum"><b>要約(アブストラクトのみが根拠)</b>${esc(d.summary.text)}`;
      if(d.summary.invalid_refs.length)h+=`<p class="note">存在しない番号の引用があります: ${d.summary.invalid_refs.join(", ")}。この要約は信頼しないでください。</p>`;h+="</div>"}
    if(!d.papers.length)h+="<p>該当する論文が見つかりませんでした。語を減らすか英語で試してください。</p>";
    d.papers.forEach(p=>{
      const links=[p.pmid&&`<a href="https://pubmed.ncbi.nlm.nih.gov/${esc(p.pmid)}/" target="_blank" rel="noopener">PubMed ${esc(p.pmid)}</a>`,
        p.doi&&`<a href="https://doi.org/${esc(p.doi)}" target="_blank" rel="noopener">DOI</a>`].filter(Boolean).join(" ");
      h+=`<article class="${p.status}${p.match==="no"?" no":""}"><h2>[${p.n}] ${esc(p.title)}</h2>
        <div class="by">${esc(p.authors.join(", "))} — ${esc(p.journal)}, ${esc(p.year)}</div>
        <div class="badge">${LABEL[p.status]}(${DOI[p.doi_check]}、取得元: ${esc(p.sources.join("・"))})</div>
        ${p.match?`<div class="rel ${p.match}"><b>${MATCH[p.match]}</b>(${p.basis==="fulltext"?"本文で照合":"アブストラクトのみで照合"}) ${esc(p.reason)}${p.quote?`<blockquote>${esc(p.quote)}${p.quote_ok?"":' <span class="note">(本文中に見つからない引用)</span>'}</blockquote>`:""}</div>`:""}
        <div>${links}</div>${p.abstract?`<details><summary>アブストラクト</summary><p>${esc(p.abstract)}</p></details>`:""}</article>`});
    $("#out").innerHTML=h;
  }catch(err){$("#out").innerHTML=`<p class="note">検索に失敗しました: ${esc(err.message)}</p>`}
  $("#go").disabled=false};
</script></body></html>
